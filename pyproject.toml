[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "equationbench"
version = "1.0.0"
description = "Procedurally generated, exactly verifiable large-equation reasoning benchmark for language models."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "EquationBench Contributors" }]
keywords = ["llm", "benchmark", "mathematics", "algebra", "evaluation", "leaderboard"]
dependencies = [
  "sympy>=1.13",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pydantic>=2.8",
  "httpx>=0.27",
  "rich>=13.7",
  "typer>=0.12",
  "jinja2>=3.1",
  "cryptography>=43",
  "tomli-w>=1.0",
  "markdown>=3.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-cov>=5.0"]

[project.scripts]
eqb = "equationbench.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/equationbench"]

[tool.hatch.build.targets.wheel.force-include]
"src/equationbench/web" = "equationbench/web"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["slow: slow-running tests"]

[tool.coverage.run]
source = ["equationbench"]
