[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "equationbench"
version = "2.0.0"
description = "Linear-system frontier benchmark with an open-ended difficulty ladder and exact scoring."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "EquationBench Contributors" }]
keywords = ["llm", "benchmark", "mathematics", "algebra", "evaluation", "leaderboard"]
dependencies = [
  "httpx>=0.27",
  "rich>=13.7",
  "typer>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-cov>=5.0", "ruff>=0.8", "sympy>=1.13"]

[project.scripts]
eqb = "equationbench.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/equationbench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["slow: slow-running tests"]

[tool.coverage.run]
source = ["equationbench"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
