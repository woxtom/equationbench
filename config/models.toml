# EquationBench model registry.
#
# The default division is "max": one answer per task, no tools, and the highest
# requested reasoning effort ("max"). Some providers clamp "max" to their highest
# supported level; the actual thinking level reported by the transport is
# recorded in every run and shown on the leaderboard.
#
# To add a model: add a [[models]] entry, run `eqb run --model <key>`, then
# rebuild the leaderboard. Any pi-supported provider can be used, or a direct
# OpenAI-compatible endpoint with provider_kind = "openai-compatible".

[[models]]
key = "openai-gpt-6-sol"
name = "GPT-6 Sol"
lab = "OpenAI"
provider = "openai"
model = "gpt-6-sol"
thinking = "max"
division = "standard"
color = "#10a37f"
notes = "OpenAI via pi OAuth."

