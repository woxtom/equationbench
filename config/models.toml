# Official rows should use a direct, stable provider API. Aggregator routes are
# useful for exploration but are not eligible for an official row until their
# provider-error rate is measured and disclosed.
#
# To add a model: add a [[models]] entry, run `eqb run --model <key>`, then
# rebuild the leaderboard.

