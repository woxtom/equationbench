name: Pages

on:
  push:
    branches: [main]
    paths:
      - "docs/index.html"
      - "data/leaderboard.json"
      - "data/leaderboard.csv"
      - "docs/leaderboard.md"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Assemble site
        run: |
          mkdir -p _site/data
          cp docs/index.html _site/index.html
          cp docs/leaderboard.md _site/leaderboard.md
          cp data/leaderboard.json _site/data/leaderboard.json
          cp data/leaderboard.csv _site/data/leaderboard.csv

      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
